{{define "content"}}
<p><a href="/plans">← All plans</a></p>
<h1>{{if .IsNew}}New plan{{else}}Edit plan{{end}}</h1>
{{with .Error}}<p class="error">{{.}}</p>{{end}}

<form method="post" action="{{if .IsNew}}/plans{{else}}/plans/{{.Plan.ID}}{{end}}">
    <label>Service type
        <select name="service_type_id" required>
            {{range .ServiceTypes}}
            <option value="{{.ID}}" {{if eq .ID $.Plan.ServiceTypeID}}selected{{end}}>{{.Name}}</option>
            {{end}}
        </select>
    </label>
    <label>Title <input name="title" value="{{.Plan.Title}}" required placeholder="e.g. Sunday Morning service"></label>

    <h2>Service window</h2>
    <p class="muted">The primary service time. A time slot with these exact start/end values is created automatically and kept in sync when you edit this plan.</p>

    <label>Date
        <input type="date" name="service_date"
               value="{{.Plan.ServiceAt.Format "2006-01-02"}}" required>
    </label>
    <div class="row">
        <label>Start time
            <input type="time" name="service_start"
                   value="{{.Plan.ServiceAt.Format "15:04"}}" required>
        </label>
        <label>End time
            <input type="time" name="service_end"
                   value="{{.Plan.ServiceEndsAt.Format "15:04"}}" required>
        </label>
    </div>
    <div class="time-preview" id="plan-time-preview"></div>

    <label>Notes <textarea name="notes" rows="3">{{.Plan.Notes}}</textarea></label>

    <p>
        <button type="submit">Save</button>
        <a href="/plans" class="button-secondary">Cancel</a>
    </p>
</form>

<script>
(function () {
    const dateEl  = document.querySelector('input[name="service_date"]');
    const startEl = document.querySelector('input[name="service_start"]');
    const endEl   = document.querySelector('input[name="service_end"]');
    const prev    = document.getElementById('plan-time-preview');
    if (!dateEl || !startEl || !endEl || !prev) return;

    function update() {
        if (!dateEl.value || !startEl.value || !endEl.value) {
            prev.textContent = '';
            return;
        }
        const start = new Date(dateEl.value + 'T' + startEl.value);
        let end     = new Date(dateEl.value + 'T' + endEl.value);
        if (end <= start) end = new Date(end.getTime() + 24 * 60 * 60 * 1000);
        const mins = Math.round((end - start) / 60000);
        const fmt  = (d) => d.toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric',
                                                   hour: '2-digit', minute: '2-digit' });
        prev.textContent = `${fmt(start)} → ${end.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}  (${mins} min)`;
    }
    dateEl.addEventListener('input', update);
    startEl.addEventListener('input', update);
    endEl.addEventListener('input', update);
    update();
})();
</script>
{{end}}
