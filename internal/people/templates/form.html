{{define "content"}}
<p><a href="/people">← All people</a></p>
<h1>Add new person</h1>
{{with .Error}}<p class="error">{{.}}</p>{{end}}

<form method="post" action="/people" class="profile-form">
    <label>Full Name <input name="name" value="{{.Name}}" required placeholder="Jane Doe"></label>
    <label>Title / Position <input name="title" value="{{.Title}}" placeholder="e.g. Worship Director"></label>
    <label>Email <input type="email" name="email" value="{{.Email}}" required placeholder="jane@example.com"></label>
    <label>Initial Password <input type="password" name="password" required minlength="6" placeholder="••••••••"></label>

    <label>Permission level
        <select name="role">
            {{if .CanAssignPrivilegedRoles}}
            <option value="admin" {{if eq .Role "admin"}}selected{{end}}>Organization Administrator</option>
            <option value="manager" {{if eq .Role "manager"}}selected{{end}}>Manager</option>
            {{end}}
            <option value="editor" {{if eq .Role "editor"}}selected{{end}}>Editor</option>
            <option value="viewer" {{if eq .Role "viewer"}}selected{{end}}>Viewer</option>
            <option value="scheduled_viewer" {{if eq .Role "scheduled_viewer"}}selected{{end}}>Scheduled Viewer</option>
        </select>
    </label>

    <p style="margin-top:1.5rem">
        <button type="submit">Create Person</button>
    </p>
</form>
{{end}}
